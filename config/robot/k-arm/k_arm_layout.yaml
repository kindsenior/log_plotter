main:
  linear q:
    legends:
      - { key: el_q, id: [0],  label: el_bottom-y }
      - { key: el_q, id: [1],  label: el_bottom-p }
      - { key: el_q, id: [2],  label: el_top-p }
      - { key: el_q, id: [3],  label: el_top-l }
      - { key: RobotHardware0_q, id: [0],label: rh_bottom-y }
      - { key: RobotHardware0_q, id: [1],label: rh_bottom-p }
      - { key: RobotHardware0_q, id: [2],label: rh_top-p }
      - { key: RobotHardware0_q, id: [3],label: rh_top-l }
      - { key: enc_q, id: [0], label: enc_bottom-y }
      - { key: enc_q, id: [1], label: enc_bottom-p }
      - { key: enc_q, id: [2], label: enc_top-p }
      - { key: enc_q, id: [3], label: enc_top-l }
    newline: false
  linear vel:
    legends:
      - { key: el_dq, id: [0],  label: el_bottom-y }
      - { key: el_dq, id: [1],  label: el_bottom-p }
      - { key: el_dq, id: [2],  label: el_top-p }
      - { key: el_dq, id: [3],  label: el_top-l }
      - { key: RobotHardware0_dq, id: [0],label: rh_bottom-y }
      - { key: RobotHardware0_dq, id: [1],label: rh_bottom-p }
      - { key: RobotHardware0_dq, id: [2],label: rh_top-p }
      - { key: RobotHardware0_dq, id: [3],label: rh_top-l }
    newline: false
  linear diff q:
    legends:
      - { key: rh_el_diff, id: [0],label: bottom-y }
      - { key: rh_el_diff, id: [1],label: bottom-p }
      - { key: rh_el_diff, id: [2],label: top-p }
      - { key: rh_el_diff, id: [3],label: top-l }
    newline: false
  linear tau:
    legends:
      - { key: torque, id: [0], label: bottom-y }
      - { key: torque, id: [1], label: bottom-p }
      - { key: torque, id: [2], label: top-p }
      - { key: torque, id: [3], label: top-l }

# rarm
  rarm q:
    legends:
      - { key: el_q, id: [4],label: el_shoulder-p }
      - { key: el_q, id: [5],label: el_shoulder-r }
      - { key: el_q, id: [6],label: el_shoulder-y }
      - { key: el_q, id: [7],label: el_elbow-p }
      - { key: el_q, id: [8],label: el_wrist-y }
      - { key: el_q, id: [9],label: el_wrist-r }
      - { key: el_q, id: [10],label: el_wrist-p }
      - { key: RobotHardware0_q, id: [4],label: rh_shoulder-p }
      - { key: RobotHardware0_q, id: [5],label: rh_shoulder-r }
      - { key: RobotHardware0_q, id: [6],label: rh_shoulder-y }
      - { key: RobotHardware0_q, id: [7],label: rh_elbow-p }
      - { key: RobotHardware0_q, id: [8],label: rh_wrist-y }
      - { key: RobotHardware0_q, id: [9],label: rh_wrist-r }
      - { key: RobotHardware0_q, id: [10],label: rh_wrist-p }
      - { key: enc_q, id: [4], label: enc_shoulder-p }
      - { key: enc_q, id: [5], label: enc_shoulder-r }
      - { key: enc_q, id: [6], label: enc_shoulder-y }
      - { key: enc_q, id: [7], label: enc_elbow-p }
      - { key: enc_q, id: [8], label: enc_wrist-y }
      - { key: enc_q, id: [9], label: enc_wrist-r }
      - { key: enc_q, id: [10], label: enc_wrist-p }
    newline: false
  rarm vel:
    legends:
      - { key: el_dq, id: [4],  label: el_shoulder-p }
      - { key: el_dq, id: [5],  label: el_shoulder-r }
      - { key: el_dq, id: [6],  label: el_shoulder-y }
      - { key: el_dq, id: [7],  label: el_elbow-p }
      - { key: el_dq, id: [8],  label: el_wrist-y }
      - { key: el_dq, id: [9],  label: el_wrist-r }
      - { key: el_dq, id: [10], label: el_wrist-p }
      - { key: RobotHardware0_dq, id: [4],label: rh_shoulder-p }
      - { key: RobotHardware0_dq, id: [5],label: rh_shoulder-r }
      - { key: RobotHardware0_dq, id: [6],label: rh_shoulder-y }
      - { key: RobotHardware0_dq, id: [7],label: rh_elbow-p }
      - { key: RobotHardware0_dq, id: [8],label: rh_wrist-y }
      - { key: RobotHardware0_dq, id: [9],label: rh_wrist-r }
      - { key: RobotHardware0_dq, id: [10],label: rh_wrist-p }
    newline: false
  rarm diff q:
    legends:
      - { key: rh_el_diff, id: [4],label: shoulder-p }
      - { key: rh_el_diff, id: [5],label: shoulder-r }
      - { key: rh_el_diff, id: [6],label: shoulder-y }
      - { key: rh_el_diff, id: [7],label: elbow-p }
      - { key: rh_el_diff, id: [8],label: wrist-y }
      - { key: rh_el_diff, id: [9],label: wrist-r }
      - { key: rh_el_diff, id: [10],label: wrist-p }
    newline: false
  rarm tau:
    legends:
      - { key: idc_tau, id: [0], label: idc_shoulder-p }
      - { key: idc_tau, id: [1], label: idc_shoulder-r }
      - { key: idc_tau, id: [2], label: idc_shoulder-y }
      - { key: idc_tau, id: [3], label: idc_elbow-p }
      - { key: idc_tau, id: [4], label: idc_wrist-y }
      - { key: idc_tau, id: [5], label: idc_wrist-r }
      - { key: idc_tau, id: [6], label: idc_wrist-p }
      - { key: torque, id: [0], label: rh_shoulder-p }
      - { key: torque, id: [1], label: rh_shoulder-r }
      - { key: torque, id: [2], label: rh_shoulder-y }
      - { key: torque, id: [3], label: rh_elbow-p }
      - { key: torque, id: [4], label: rh_wrist-y }
      - { key: torque, id: [5], label: rh_wrist-r }
      - { key: torque, id: [6], label: rh_wrist-p }

